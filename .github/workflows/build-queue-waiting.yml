# ---------------------------------------------------------------------------
# Workflow to build and deploy the Queue & Waiting Service
# ---------------------------------------------------------------------------
# This CI/CD pipeline automates the full delivery cycle for the Queue &
# Waiting analytics microservice:
#   1. Builds a Docker image from the repository Dockerfile
#   2. Pushes the image to Docker Hub with multiple tags for traceability
#   3. Updates the DevOps (GitOps) repository with the new image tag
#   4. ArgoCD detects the change and auto-syncs the deployment in Kubernetes
#
# Triggers:
#   - Push to main, dev, or staging branches (only on core file changes)
#   - Manual dispatch from the GitHub Actions UI (workflow_dispatch)
# ---------------------------------------------------------------------------
name: Build and Deploy Queue & Waiting Service

# ---------------------------------------------------------------------------
# Trigger configuration
# ---------------------------------------------------------------------------
# The workflow runs automatically when changes are pushed to main, dev, or
# staging branches. To avoid unnecessary runs, it only triggers when files
# in the specified paths are modified. A manual trigger is also available.
# ---------------------------------------------------------------------------
on:
  push:
    branches:
      - main      # Production branch
      - dev       # Development branch
      - staging   # Staging / pre-production branch
    # Only trigger on changes to core files (skip docs, config, etc.)
    paths:
      - 'src/**'                                            # Application source code
      - 'models/**'                                         # YOLO model weights
      - 'Dockerfile'                                        # Container build definition
      - 'requirements.txt'                                  # Python dependencies
      - '.github/workflows/build-queue-waiting.yml'         # This workflow file itself
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

# ---------------------------------------------------------------------------
# Global environment variables shared across all jobs and steps
# ---------------------------------------------------------------------------
env:
  # Docker Hub repository name for the queue & waiting service image
  # This is used as the base name for all image tags pushed to the registry
  IMAGE_NAME: kishore2712/godezk_device_queue_waiting

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------
# This workflow has a single job that handles building, pushing, and
# updating the DevOps repo. The job runs on the latest Ubuntu runner.
# ---------------------------------------------------------------------------
jobs:
  # Main job to build Docker image and push to registry
  build-and-push:
    # Use the latest Ubuntu runner provided by GitHub-hosted runners
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      # Pulls the latest commit from the triggered branch into the runner workspace
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Determine deployment environment based on branch
      # Maps the pushed branch name to a deployment environment label:
      #   main    -> production
      #   dev     -> dev
      #   staging -> staging
      - name: Set environment
        id: env
        # Map git branch to deployment environment (main -> production)
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      # Step 3: Compute short SHA for image tagging
      # Extracts the first 7 characters of the commit SHA for human-readable image tags
      - name: Compute short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      # Step 4: Authenticate with Docker Hub
      # Uses repository secrets DOCKER_USERNAME and DOCKER_PASSWORD for registry login
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 5: Set up Docker Buildx for advanced build features
      # Buildx enables multi-platform builds, advanced layer caching, and
      # other features not available with the default Docker builder
      - name: Set up Docker Buildx
        # Enable multi-platform builds and layer caching
        uses: docker/setup-buildx-action@v3

      # Step 6: Build and push Docker image with multiple tags
      # Builds the image from the Dockerfile and pushes it to Docker Hub with three tags:
      #   1. :latest                     - always points to the most recent build
      #   2. :<full-sha>                 - unique per commit for traceability
      #   3. :<env>-<short-sha>          - environment-friendly tag (e.g., dev-abc1234)
      # Registry caching is used to speed up subsequent builds by reusing cached layers
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Tag with: latest, full SHA, and environment-friendly short tag (e.g., dev-abc1234)
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ steps.env.outputs.environment }}-${{ steps.sha.outputs.short }}
          # Use registry cache for faster builds
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      # Step 7: Generate deployment summary for GitHub UI
      # Writes a markdown summary to the GitHub Actions run page for quick visibility
      - name: Deployment summary
        run: |
          echo "### Deployment Summary :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ steps.env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tagged Image:** ${{ env.IMAGE_NAME }}:${{ steps.env.outputs.environment }}-${{ steps.sha.outputs.short }}" >> $GITHUB_STEP_SUMMARY

      # Step 8: Update DevOps repository with new image tag to trigger ArgoCD sync
      # ---------------------------------------------------------------------
      # This step clones the separate DevOps (GitOps) repository, updates the
      # image tag in the kustomization.yaml for the corresponding environment,
      # and pushes the change. ArgoCD watches this repo and will automatically
      # sync the new image tag to the Kubernetes cluster.
      # ---------------------------------------------------------------------
      # Skip for PRs; update kustomization.yaml in devops repo to trigger ArgoCD sync
      - name: Update DevOps repo with new image tag
        if: steps.env.outputs.environment != 'pr'
        env:
          # Personal Access Token with write access to the DevOps repo
          DEVOPS_PAT: ${{ secrets.DEVOPS_PAT }}
        run: |
          # Configure git identity for automated commits
          git config --global user.email "ci@godezk-device.com"
          git config --global user.name "GoDezk Device CI"

          # Clone the DevOps repo using a PAT stored in repository secrets
          git clone https://kishorek421:${DEVOPS_PAT}@github.com/kishorek421/godezk_device_devops.git devops
          cd devops

          # Determine the target branch in the DevOps repo
          # production environment maps to the main branch in the DevOps repo
          BRANCH_NAME="${{ steps.env.outputs.environment }}"
          if [ "$BRANCH_NAME" = "production" ]; then
            BRANCH_NAME="main"
          fi
          git checkout $BRANCH_NAME || git checkout -b $BRANCH_NAME

          # Navigate to the kustomize overlay for this service and environment
          cd k8s/services/queue_waiting/overlays/$BRANCH_NAME

          # Update the image tag in kustomization.yaml to the newly built image
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          sed -i "s|newTag:.*|newTag: ${{ steps.env.outputs.environment }}-${SHORT_SHA}|g" kustomization.yaml

          # Commit and push the updated kustomization.yaml
          # ArgoCD watches this repo and will auto-sync the new image tag
          git add kustomization.yaml
          git diff --staged --quiet || git commit -m "ci: update queue-waiting ${{ steps.env.outputs.environment }} image to ${SHORT_SHA}"
          git pull --rebase origin $BRANCH_NAME
          git push origin $BRANCH_NAME
